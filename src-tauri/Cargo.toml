[package]
name = "downplayed"
version = "0.1.0"
description = "Lightweight, local-first League of Legends clip recorder"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "downplayed"

[lib]
name = "downplayed_lib"
crate-type = ["rlib"]

[[bin]]
name = "downplayed"
path = "src/main.rs"

# Developer tool: fixture replay, LCU phase watch, live marker printout.
[[bin]]
name = "downplayed-dev"
path = "src/bin/downplayed-dev.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# `protocol-asset`: the review's <video> streams match.mp4 from the library folder.
# `image-png`: the tray's own icon (icons/tray.png).
tauri = { version = "2.12", features = ["tray-icon", "protocol-asset", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process"] }
# TLS is always our own rustls config (Riot root only, ring provider), so no
# default provider or root store is pulled in here.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# Only to recognise "connection closed" errors (a game process dying mid-request).
hyper = { version = "1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "registry", "ansi"] }
regex = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
dirs = "6"
thiserror = "2"
# The library's index (`library.db`), a cache of the match folders' sidecars; SQLite is
# compiled in.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# The one message after a game the window can't show (low disk): a Windows notification.
tauri-plugin-notification = "2.7.0"
# Opening Downplayed again brings up the running one instead of a second tracker.
tauri-plugin-single-instance = "2.5.4"

# Capture: the monitor League is on (DXGI adapter/output), a job object so ffmpeg never
# outlives Downplayed, WASAPI audio, the shell for library files (Recycle Bin, clipboard,
# Save as), and the time zone for Outplayed's local-time names. Tauri already builds this
# version of the crate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` (the process-loopback activation callback) expands to `windows_core` paths.
windows-core = "0.62"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
